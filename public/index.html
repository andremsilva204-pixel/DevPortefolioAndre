<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0">

    <title>DevPortefolio</title>

    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/responsive.css">


</head>

<body>

<header>
    <nav class="navbar container">

        <a href="/" class="logo">
            DevPortefolio
        </a>

        <ul class="nav-links">
            <li>
                <a href="/">Início</a>
            </li>

            <li>
                <a href="/dashboard/portfolio.html">
                    Portfólios
                </a>
            </li>

            <li>
                <a href="/login.html">
                    Login
                </a>
            </li>

            <li>
                <button id="theme-toggle" class="btn btn-secondary">
                    🌙
                </button>
            </li>
        </ul>

    </nav>
</header>

<main>

<section class="hero">

    <div class="container">

        <h1>
            DevPortefolio
        </h1>

        <p>
            Descobre projetos desenvolvidos por formandos
            e apresenta o teu trabalho de programação.
        </p>

        <br>

        <a href="/dashboard/portfolio.html" class="btn">
            Explorar projetos
        </a>

    </div>

</section>

<section class="section">

    <div class="container">

        <h2 class="section-title">
            Projetos recentes
        </h2>

        <div id="projects-container"
             class="projects-grid">

            <div class="loading">
                A carregar projetos...
            </div>

        </div>

    </div>

</section>

</main>

<script type="module">

import { apiRequest } from "/js/api.js";

import "/js/theme.js";

async function loadProjects() {

    const container =
        document.querySelector("#projects-container");

    try {

        const data =
            await apiRequest("/api/projects");

        if (data.projects.length === 0) {

            container.innerHTML = `
                <div class="empty-state">
                    Ainda não existem projetos.
                </div>
            `;

            return;
        }

        container.innerHTML =
            data.projects.slice(0, 6).map(project => `

                <article class="project-card">

                    ${
                        project.image_url
                        ? `<img src="${project.image_url}"
                                alt="${project.title}">`
                        : ""
                    }

                    <div class="project-card-content">

                        <h3>
                            ${project.title}
                        </h3>

                        <p>
                            ${project.description}
                        </p>

                        <p>
                            Desenvolvido por:
                            ${project.author}
                        </p>

                        <a
                            href="/dashboard/project.html?id=${project.id}"
                            class="btn">
                            Ver projeto
                        </a>


                    </div>

                </article>

            `).join("");

    } catch (error) {

        container.innerHTML = `
            <div class="empty-state">
                Não foi possível carregar os projetos.
            </div>
        `;
    }
}

loadProjects();

</script>

</body>
</html>
