<!DOCTYPE html>
<html lang="pt-PT">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Portfólios | DevPortefolio</title>

    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/responsive.css">



</head>

<body>

<header>

<nav class="navbar container">

    <a href="/" class="logo">
        DevPortefolio
    </a>

    <ul class="nav-links">

        <li>
            <a href="/">
                Início
            </a>
        </li>

        <li>
            <a href="/login.html">
                Login
            </a>
        </li>

        <li>
            <button
                id="theme-toggle"
                class="btn btn-secondary">
                🌙
            </button>
        </li>

    </ul>

</nav>

</header>

<main>

<section class="section">

<div class="container">

<h1>
    Portfólios
</h1>

<br>

<div class="form-group">

    <input
        type="search"
        id="search"
        placeholder="Pesquisar projetos...">

</div>

<div
    id="projects-container"
    class="projects-grid">

    <div class="loading">
        A carregar...
    </div>

</div>

</div>

</section>

</main>

<script type="module">

import { apiRequest }
    from "/js/api.js";

import "/js/theme.js";

const container =
    document.querySelector("#projects-container");

const search =
    document.querySelector("#search");

let projects = [];

async function loadProjects() {

    try {

        const data =
           await apiRequest("/api/projects");

        projects = data.projects;

        renderProjects(projects);

    } catch (error) {

        container.innerHTML = `
            <div class="empty-state">
                Erro ao carregar projetos.
            </div>
        `;
    }
}

function renderProjects(items) {

    if (items.length === 0) {

        container.innerHTML = `
            <div class="empty-state">
                Nenhum projeto encontrado.
            </div>
        `;

        return;
    }

    container.innerHTML =
        items.map(project => `

        <article class="project-card">

            ${
                project.image_url
                ? `
                <img
                    src="${project.image_url}"
                    alt="${project.title}">
                `
                : ""
            }

            <div class="project-card-content">

                <h3>
                    ${project.title}
                    ${project.id === 1 ? " (Exemplo)" : ""}
                </h3>

                <p>
                    ${project.description}
                </p>

                <small>
                    ${project.author}
                </small>

                <br><br>

                <a
                    href="/dashboard/project.html?id=${project.id}"
                    class="btn">
                    Ver projeto
                </a>

                <button
                    class="btn btn-danger delete-project"
                        data-id="${project.id}">
                    Eliminar
                </button>


            </div>

        </article>

    `).join("");
}

search.addEventListener("input", () => {

    const value =
        search.value.toLowerCase();

    const filtered =
        projects.filter(project =>
            project.title
                .toLowerCase()
                .includes(value)
            ||
            project.description
                .toLowerCase()
                .includes(value)
        );

    renderProjects(filtered);

});

document.addEventListener("click", async (event) => {

    if (!event.target.classList.contains("delete-project")) {
        return;
    }

    const id = event.target.dataset.id;

    if (!confirm("Tens a certeza que queres eliminar este projeto?")) {
        return;
    }

    try {

        await apiRequest(`/projects/${id}`, {
            method: "DELETE"
        });

        projects = projects.filter(
            project => String(project.id) !== String(id)
        );

        renderProjects(projects);

    } catch (error) {

        alert("Erro ao eliminar o projeto.");

    }

});

loadProjects();

</script>

</body>
</html>
