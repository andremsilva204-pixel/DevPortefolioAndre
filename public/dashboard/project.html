<!DOCTYPE html>
<html lang="pt-PT">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Portfólios | DevPortefolio</title>

    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/responsive.css">


</head>

<body>

<header>

<nav class="navbar container">

    <a href="/" class="logo">
        DevPortefolio
    </a>

    <ul class="nav-links">

        <li>
            <a href="/">
                Início
            </a>
        </li>

        <li>
            <a href="/login.html">
                Login
            </a>
        </li>

        <li>
            <button
                id="theme-toggle"
                class="btn btn-secondary">
                🌙
            </button>
        </li>

    </ul>

</nav>

</header>

<main>

<section class="section">

<div class="container">

<h1>
    Portfólios
</h1>

<br>

<div class="form-group">

    <input
        type="search"
        id="search"
        placeholder="Pesquisar projetos...">

</div>

<div
    id="projects-container"
    class="projects-grid">

    <div class="loading">
        A carregar...
    </div>

</div>

</div>

</section>

</main>

<script type="module">

import { apiRequest }
    from "/js/api.js";

import "/js/theme.js";

const container =
    document.querySelector("#projects-container");

const search =
    document.querySelector("#search");

let projects = [];

async function loadProjects() {

    try {

        const data =
            await apiRequest("/api/projects");

        projects = data.projects;

        renderProjects(projects);

    } catch (error) {

        container.innerHTML = `
            <div class="empty-state">
                Erro ao carregar projetos.
            </div>
        `;
    }
}

function renderProjects(items) {

    if (items.length === 0) {

        container.innerHTML = `
            <div class="empty-state">
                Nenhum projeto encontrado.
            </div>
        `;

        return;
    }

    container.innerHTML =
    items.map(project => `

            <article class="project-card">

                ${
                    project.image_url
                    ? `
                    <img
                        src="${project.image_url}"
                        alt="${project.title}">
                    `
                    : ""
                }

                <div class="project-card-content">

                    <h3>
                        ${project.title}
                    </h3>

                    <p>
                        ${project.description}
                    </p>

                    <small>
                        ${project.author}
                    </small>

                    <br><br>

                    <a
                        href="/dashboard/project.html?id=${project.id}"
                        class="btn">
                        Ver projeto
                    </a>

                </div>

            </article>

        `).join("");
}


search.addEventListener("input", () => {

    const value =
        search.value.toLowerCase();

    const filtered =
        projects.filter(project =>
            project.title
                .toLowerCase()
                .includes(value)
            ||
            project.description
                .toLowerCase()
                .includes(value)
        );

    renderProjects(filtered);

});

async function loadSingleProject(id) {

    try {

        const data =
            await apiRequest(`/api/projects/${id}`);

        const project =
            data.project;

        container.innerHTML = `

            <article class="project-card">

                ${
                    project.image_url
                    ? `
                    <img
                        src="${project.image_url}"
                        alt="${project.title}">
                    `
                    : ""
                }

                <div class="project-card-content">

                    <h1>
                        ${project.title}
                    </h1>

                    <br>

                    <p>
                        ${project.description}
                    </p>

                    <br>

                    <small>
                        Desenvolvido por:
                        ${project.author}
                    </small>

                    <br><br>

                    ${
                        project.github_url
                        ? `
                        <a
                            href="${project.github_url}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="btn">
                            GitHub
                        </a>
                        `
                        : ""
                    }

                    ${
                        project.live_url
                        ? `
                        <a
                            href="${project.live_url}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="btn">
                            Ver projeto online
                        </a>
                        `
                        : ""
                    }

                    <br><br>

                    <a
                        href="/dashboard/project.html"
                        class="btn btn-secondary">
                        ← Voltar aos projetos
                    </a>

                </div>

            </article>

        `;

    } catch (error) {

        container.innerHTML = `
            <div class="empty-state">

                <h2>
                    Projeto não encontrado
                </h2>

                <p>
                    Não foi possível carregar o projeto.
                </p>

                <br>

                <a
                    href="/dashboard/project.html"
                    class="btn">
                    Voltar aos projetos
                </a>

            </div>
        `;
    }
}

async function loadEditProject(id) {

    try {

        const data =
            await apiRequest(
                `/api/projects/${encodeURIComponent(id)}`
            );

        const project =
            data.project;


        container.innerHTML = `

            <div class="form-container">

                <h1>
                    Editar projeto
                </h1>

                <br>

                <div class="form-group">

                    <label for="edit-title">
                        Título
                    </label>

                    <input
                        id="edit-title"
                        value="${project.title || ""}"
                        required>

                </div>


                <div class="form-group">

                    <label for="edit-description">
                        Descrição
                    </label>

                    <textarea
                        id="edit-description"
                        required>${project.description || ""}</textarea>

                </div>


                <div class="form-group">

                    <label for="edit-long-description">
                        Descrição completa
                    </label>

                    <textarea
                        id="edit-long-description">${project.long_description || ""}</textarea>

                </div>


                <div class="form-group">

                    <label for="edit-github">
                        GitHub
                    </label>

                    <input
                        id="edit-github"
                        type="url"
                        value="${project.github_url || ""}">

                </div>


                <div class="form-group">

                    <label for="edit-live">
                        Link online
                    </label>

                    <input
                        id="edit-live"
                        type="url"
                        value="${project.live_url || ""}">

                </div>


                <div class="form-group">

                    <label for="edit-level">
                        Nível
                    </label>

                    <select id="edit-level">

                        <option value="">
                            Selecionar
                        </option>

                        <option
                            value="Iniciante"
                            ${project.level === "Iniciante" ? "selected" : ""}>
                            Iniciante
                        </option>

                        <option
                            value="Intermédio"
                            ${project.level === "Intermédio" ? "selected" : ""}>
                            Intermédio
                        </option>

                        <option
                            value="Avançado"
                            ${project.level === "Avançado" ? "selected" : ""}>
                            Avançado
                        </option>

                    </select>

                </div>


                <button
                    type="button"
                    id="save-project"
                    class="btn">
                    Guardar alterações
                </button>


                <a
                    href="/dashboard/project.html"
                    class="btn btn-secondary">
                    Cancelar
                </a>


                <div
                    id="edit-message"
                    class="message">
                </div>

            </div>

        `;


        document
            .querySelector("#save-project")
            .addEventListener(
                "click",
                async () => {

                    const button =
                        document.querySelector(
                            "#save-project"
                        );

                    const editMessage =
                        document.querySelector(
                            "#edit-message"
                        );


                    button.disabled = true;

                    button.textContent =
                        "A guardar...";


                    try {

                        await apiRequest(
                            `/api/projects/${encodeURIComponent(id)}`,
                            {
                                method: "PUT",

                                body: JSON.stringify({

                                    title:
                                        document
                                            .querySelector("#edit-title")
                                            .value
                                            .trim(),

                                    description:
                                        document
                                            .querySelector("#edit-description")
                                            .value
                                            .trim(),

                                    long_description:
                                        document
                                            .querySelector("#edit-long-description")
                                            .value
                                            .trim(),

                                    github_url:
                                        document
                                            .querySelector("#edit-github")
                                            .value
                                            .trim(),

                                    live_url:
                                        document
                                            .querySelector("#edit-live")
                                            .value
                                            .trim(),

                                    level:
                                        document
                                            .querySelector("#edit-level")
                                            .value

                                })
                            }
                        );


                        editMessage.textContent =
                            "Projeto atualizado com sucesso.";

                        editMessage.className =
                            "message success";


                        setTimeout(() => {

                            window.location.href =
                                `/dashboard/project.html?id=${encodeURIComponent(id)}`;

                        }, 700);


                    } catch (error) {

                        editMessage.textContent =
                            error.message ||
                            "Erro ao atualizar o projeto.";

                        editMessage.className =
                            "message error";


                    } finally {

                        button.disabled = false;

                        button.textContent =
                            "Guardar alterações";
                    }

                }
            );


    } catch (error) {

        console.error(
            "Erro ao carregar projeto para edição:",
            error
        );

        container.innerHTML = `
            <div class="empty-state">

                <h2>
                    Não foi possível editar o projeto
                </h2>

                <p>
                    ${error.message || "Erro ao carregar o projeto."}
                </p>

                <br>

                <a
                    href="/dashboard/project.html"
                    class="btn">
                    Voltar aos projetos
                </a>

            </div>
        `;
    }
}


const params =
    new URLSearchParams(window.location.search);

const projectId =
    params.get("id");

const editMode =
    params.get("edit") === "true";


if (projectId && editMode) {

    loadEditProject(projectId);

} else if (projectId) {

    loadSingleProject(projectId);

} else {

    loadProjects();

}


</script>

</body>
</html>
