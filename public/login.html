<!DOCTYPE html>
<html lang="pt-PT">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login | DevPortefolio</title>

    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/responsive.css">



</head>


<body>


<header>

    <nav class="navbar container">

        <a
            href="/"
            class="logo">

            DevPortefolio

        </a>

    </nav>

</header>


<main>

<div class="container">

<form
    id="login-form"
    class="form-container">


    <h1>
        Login
    </h1>


    <br>


    <!-- EMAIL -->

    <div class="form-group">

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="exemplo@email.com"
            required>

    </div>


    <!-- PASSWORD -->

    <div class="form-group">

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            required>

    </div>


    <!-- BOTÃO -->

    <button
        type="submit"
        class="btn"
        id="login-button">

        Entrar

    </button>


    <!-- MENSAGEM -->

    <div
        id="message"
        class="message">
    </div>


    <br>


    <p>

        Ainda não tens conta?

        <a href="/register.html">
            Registar
        </a>

    </p>


</form>

</div>

</main>


<script type="module">

import {
    apiRequest
} from "/js/api.js";


const form =
    document.querySelector(
        "#login-form"
    );


const message =
    document.querySelector(
        "#message"
    );


const button =
    document.querySelector(
        "#login-button"
    );


form.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();


        message.textContent = "";

        message.className =
            "message";


        const email =
            document
                .querySelector("#email")
                .value
                .trim();


        const password =
            document
                .querySelector("#password")
                .value;


        button.disabled = true;

        button.textContent =
            "A entrar...";


        try {

            const data =
                await apiRequest(
                    "/api/auth/login",
                    {
                        method: "POST",

                        body: JSON.stringify({

                            email: email,

                            password: password

                        })
                    }
                );


            if (data.token) {
                localStorage.setItem("token", data.token);
            }

            if (data.user) {
                localStorage.setItem("user", JSON.stringify(data.user));
            }


            message.textContent =
                data.message;

            message.classList.add(
                "success"
            );


            // Mostrar no console
            // para verificarmos a role

            console.log(
                "Utilizador autenticado:",
                data.user
            );


            /*
             * Aqui temos acesso a:
             *
             * data.user.id
             * data.user.name
             * data.user.email
             * data.user.role
             *
             * Exemplo:
             *
             * student
             * teacher
             */


            setTimeout(() => {

                window.location.href =
                    "/dashboard/dashboard.html";

            }, 700);


        } catch (error) {

            message.textContent =
                error.message ||
                "Erro ao efetuar login.";

            message.classList.add(
                "error"
            );


        } finally {

            button.disabled = false;

            button.textContent =
                "Entrar";

        }

    }
);

</script>


</body>

</html>
